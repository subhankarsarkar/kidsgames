const POS=[[100,75],[300,75],[100,225],[300,225]],NM=['🐶','🐱','🧒','🐸'],ME=2;let L=[3,3,3,3],ball={f:0,t:1,k:0,w:0},tap=-1;KQ.length=0;cv.onpointerdown=e=>{const[x,y]=pt(cv,e);tap=(x>200?1:0)+(y>150?2:0)};msg('❤️❤️❤️ Get ready!');

const send=(f,t)=>{ball={f,t,k:0,w:0}},lose=i=>{L[i]--;msg(i==ME?'You missed! '+'❤️'.repeat(Math.max(0,L[ME])):NM[i]+' missed! 🎉');if(L[ME]<=0){fin(el,'You are out! Better luck next time.',()=>foursq(el));return 1}if(!oth().length){fin(el,'You are the Four Square champion! 🏆🎉 '+'⭐'.repeat(L[ME]),()=>foursq(el));return 1}const s=alive()[R(alive().length)];send(s,alive().filter(x=>x!=s)[R(alive().length-1)]);ball.k=-30;return 0};
lp(()=>{if(ball.k<0){ball.k++;draw();return}

if(ball.k<1)ball.k=Math.min(1,ball.k+.025);else ball.w++;
let hit=-1;const o=oth();while(KQ.length){const n=+KQ.shift();if(n>=1&&n<=3&&o[n-1]!=null)hit=o[n-1]}if(tap>=0&&tap!=ME&&L[tap]>0)hit=tap;tap=-1;
if(ball.t==ME){if(hit>=0&&(ball.k>.7)&&ball.w<30){send(ME,hit);draw();return}if(ball.w>30){if(lose(ME))return}}
else if(ball.k>=1){if(ball.w>16){if(Math.random()<.82){const to=alive().filter(x=>x!=ball.t);send(ball.t,to[R(to.length)])}else if(lose(ball.t))return}}
draw()});
function draw(){g.fillStyle='#d3f9d8';g.fillRect(0,0,400,300);g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(10,10,380,280);g.beginPath();g.moveTo(200,10);g.lineTo(200,290);g.moveTo(10,150);g.lineTo(390,150);g.stroke();g.textAlign='center';
POS.forEach((p,i)=>{g.globalAlpha=L[i]>0?1:.25;g.font='40px serif';g.fillText(NM[i],p[0],p[1]+12);g.font='14px serif';g.fillText('❤️'.repeat(Math.max(0,L[i])),p[0],p[1]+38);if(i!=ME&&L[i]>0){g.font='bold 14px sans-serif';g.fillStyle='#1c1b29';g.fillText('['+(oth().indexOf(i)+1)+']',p[0]+34,p[1]-18)}g.globalAlpha=1});

function statues(el){const BOT=['🐶','🐱','🐸','🐵','🐼'],PS=['🧍','🦸','🤸','🧘','🕴️'];let alive=[0,1,2,3,4],ph='music',tk=0,mt=0,rd=0,pose=0,moved=0,pk=KPN,tapd=0,ac=null;

if(ph=='pass'){g.fillStyle='#868e96';g.fillRect(90,160,300,16);g.fillStyle='#51cf66';g.fillRect(90+300*.28,160,300*.44,16);g.fillStyle='#ffd43b';g.fillRect(90+300*.4,160,300*.2,16);g.fillStyle='#e03131';g.fillRect(86+300*m,156,8,24);txt(g,'BATON PASS!',240,150,14,'#1c1b29')}})}
