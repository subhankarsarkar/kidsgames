const deal=()=>D.pop(),sc=()=>msg('Wins '+w+' · Losses '+l+' · Ties '+t);
const cd=(c,hide)=>hide?'<span style="display:inline-block;width:54px;height:78px;margin:3px;border-radius:8px;background:#1971c2;border:2px solid #fff;color:#fff;font:bold 26px sans-serif;line-height:74px">?</span>':'<span style="display:inline-block;width:54px;height:78px;margin:3px;border-radius:8px;background:#fff;color:'+(c.s=='♥'||c.s=='♦'?'#d00':'#111')+';border:2px solid #999;font:bold 20px sans-serif;line-height:1.15;padding-top:10px;box-sizing:border-box">'+c.r+'<br>'+c.s+'</span>';
function draw(){el.innerHTML='<p>Get as close to <b>21</b> as you can without going over. Beat the dealer!</p><h3>Dealer'+(on?'':' ('+val(Dl)+')')+'</h3><div>'+Dl.map((c,i)=>cd(c,on&&i==0)).join('')+'</div><h3>You ('+val(P)+')</h3><div>'+P.map(c=>cd(c)).join('')+'</div><div id="ac" style="margin-top:10px"></div>';const a=$('ac');
if(on){btn(a,'🃏 Hit (take a card)',()=>{P.push(deal());if(val(P)>21)end('Bust! Over 21 – dealer wins',-1);else if(val(P)==21)stand();else draw()});btn(a,'✋ Stand',stand)}else btn(a,'▶ Deal new round',start)}
function end(m,r){on=0;if(r>0)w++;else if(r<0)l++;else t++;draw();msg(m+'   (Wins '+w+' · Losses '+l+' · Ties '+t+')')}
function stand(){while(val(Dl)<17)Dl.push(deal());const p=val(P),d=val(Dl);on=0;if(d>21)end('Dealer busts – you win! 🎉',1);else if(p>d)end('You win with '+p+' vs '+d+'! 🎉',1);else if(p<d)end('Dealer wins '+d+' vs '+p,-1);else end('A tie at '+p,0)}
function start(){D=[];SU.forEach(s=>RK.forEach(r=>D.push({s,r,v:r=='A'?11:'JQK'.includes(r)?10:+r})));D.sort(()=>Math.random()-.5);P=[deal(),deal()];Dl=[deal(),deal()];on=1;draw();if(val(P)==21){on=0;if(val(Dl)==21)end('Both have 21 – a tie',0);else end('TWENTY-ONE! You win! 🎉',1)}else sc()}
draw();msg('Press Deal to start!')}
// American Football (run to the end zone)
function amfb(el){const[cv,g]=mk(el,480,300,'↑ ↓ dodge the defenders · hold → to sprint · Space to spin (they can’t tackle you for a moment). Run 100 yards to score a touchdown! 4 downs.');
let d=0,y=150,sp=0,cool=0,spin=0,D=[],down=1,td=0,yards=0,f=0,wait=0,res='';const FL=3000;
const reset=()=>{d=0;y=150;D=[];spin=0;cool=0};msg('Down 1 of 4 · Touchdowns 0');
lp(()=>{f++;if(wait){wait--;if(!wait){if(down>4){fin(el,'Game over! '+td+' touchdowns, '+yards+' yards total '+'⭐'.repeat(td>=3?3:td>=1?2:1),()=>amfb(el));return}reset();msg('Down '+down+' of 4 · Touchdowns '+td)}}else{
if(KY.ArrowUp)y-=3.6;if(KY.ArrowDown)y+=3.6;y=Math.max(30,Math.min(270,y));sp=KY.ArrowRight?5:3.2;d+=sp;if(KY[' ']&&!cool){spin=14;cool=60}if(spin>0)spin--;if(cool>0)cool--;
if(f%32==0)D.push({x:d+520+Math.random()*180,y:30+Math.random()*240,v:1.8+Math.random()*1.4+d/2000});
D.forEach(o=>{o.x-=o.v;o.y+=Math.sign(y-o.y)*.9;if(!spin&&Math.abs(o.x-d)<20&&Math.abs(o.y-y)<20&&!wait){yards+=Math.floor(d/30);res='Tackled after '+Math.floor(d/30)+' yards!';down++;wait=50;msg(res+' · Touchdowns '+td)}});D=D.filter(o=>o.x>d-100);
if(d>=FL&&!wait){td++;yards+=100;res='TOUCHDOWN! 🏈🎉';down++;wait=60;msg(res+' · Touchdowns '+td)}}
const cam=d-100;g.fillStyle='#2f9e44';g.fillRect(0,0,480,300);g.fillStyle='#37b24d';for(let i=0;i<20;i++)if(i%2)g.fillRect(((i*150-cam)%3000+3000)%3000-150,0,150,300);
g.strokeStyle='#fff';g.lineWidth=2;for(let i=0;i<=100;i+=10){const x=i*30-cam;if(x>-10&&x<490){g.beginPath();g.moveTo(x,0);g.lineTo(x,300);g.stroke();txt(g,i<=50?i:100-i,x,22,14)}}
g.fillStyle='#e03131aa';g.fillRect(FL-cam,0,200,300);txt(g,'END ZONE',FL-cam+60,150,20);
D.forEach(o=>{const x=o.x-cam;g.fillStyle='#1971c2';g.beginPath();g.arc(x,o.y,14,0,7);g.fill();g.fillStyle='#ffcc99';g.beginPath();g.arc(x,o.y-12,6,0,7);g.fill()});
g.globalAlpha=spin?.5:1;g.fillStyle='#e03131';g.beginPath();g.arc(100,y,14,0,7);g.fill();g.fillStyle='#ffcc99';g.beginPath();g.arc(100,y-12,6,0,7);g.fill();g.globalAlpha=1;g.font='18px serif';g.textAlign='center';g.fillText('🏈',116,y+4);
g.fillStyle='#0007';g.fillRect(8,8,200,34);txt(g,'Yards '+Math.min(100,Math.floor(d/30))+' · Down '+Math.min(4,down)+'/4 · TD '+td,108,31,15);if(wait)txt(g,res,240,150,30)})}
// Basketball
function bball(el){const[cv,g]=mk(el,480,300,'Drag back from the ball (the dotted line shows the path) and let go to shoot. Score as many baskets as you can in 45 seconds! After 3 baskets the hoop starts moving.');
let b={x:80,y:240,vx:0,vy:0,fly:0,sc:0},dr=null,sc=0,st=0,t0=0,f=0,rs=0,msgT='',mt=0;const R=9;
cv.onpointerdown=e=>{if(!b.fly)dr={s:pt(cv,e),c:pt(cv,e)}};cv.onpointermove=e=>{if(dr)dr.c=pt(cv,e)};
cv.onpointerup=()=>{if(dr&&!b.fly){const vx=(dr.s[0]-dr.c[0])*.11,vy=(dr.s[1]-dr.c[1])*.11,s=Math.hypot(vx,vy);if(s>1.5){const k=Math.min(1,15/s);b.vx=vx*k;b.vy=vy*k;b.fly=1;b.sc=0;if(!st){st=1;t0=Date.now()}}}dr=null};
msg('Basketball: drag back and let go!');
lp(()=>{f++;const left=st?Math.max(0,45-(Date.now()-t0)/1000):45,hy=125+(sc>=3?Math.sin(f*.03)*45:0);
if(st&&left<=0){fin(el,'Time up! '+sc+' baskets = '+sc*2+' points '+'⭐'.repeat(sc>=8?3:sc>=4?2:1),()=>bball(el));return}
if(b.fly){const py=b.y;b.vy+=.34;b.x+=b.vx;b.y+=b.vy;[[376,hy],[420,hy]].forEach(p=>{const dx=b.x-p[0],dy=b.y-p[1],dd=Math.hypot(dx,dy);if(dd<R+3&&dd>0){const nx=dx/dd,ny=dy/dd,dt=b.vx*nx+b.vy*ny;if(dt<0){b.vx-=1.6*dt*nx;b.vy-=1.6*dt*ny}b.x=p[0]+nx*(R+3);b.y=p[1]+ny*(R+3)}});
if(b.x+R>428&&b.y>hy-60&&b.y<hy+15){b.x=428-R;b.vx=-Math.abs(b.vx)*.55}
if(!b.sc&&py<hy&&b.y>=hy&&b.x>378&&b.x<418&&b.vy>0){b.sc=1;sc++;msgT='SWISH! +2 🏀';mt=40;msg('Baskets '+sc+' · Points '+sc*2)}
if(b.y>290){b.y=290;b.vy=-Math.abs(b.vy)*.5;b.vx*=.7;if(Math.abs(b.vy)<1.5)rs=1}if(b.x<R){b.x=R;b.vx=Math.abs(b.vx)*.6}if(b.x>480-R){b.x=480-R;b.vx=-Math.abs(b.vx)*.6}
if(rs||b.y>400){b={x:80,y:240,vx:0,vy:0,fly:0,sc:0};rs=0}}
if(mt>0)mt--;
g.fillStyle='#ffe8cc';g.fillRect(0,0,480,300);g.fillStyle='#c68642';g.fillRect(0,290,480,10);g.fillStyle='#a5d8ff';g.fillRect(0,0,480,60);
g.fillStyle='#fff';g.fillRect(428,hy-60,8,75);g.strokeStyle='#e03131';g.lineWidth=3;g.strokeRect(430,hy-30,4,28);g.beginPath();g.moveTo(376,hy);g.lineTo(420,hy);g.stroke();g.strokeStyle='#fff';g.lineWidth=1;for(let i=0;i<5;i++){g.beginPath();g.moveTo(378+i*10,hy);g.lineTo(386+i*6,hy+22);g.stroke()}
g.fillStyle='#ffcc99';g.beginPath();g.arc(50,262,9,0,7);g.fill();g.fillStyle='#1971c2';g.fillRect(42,270,16,22);
if(dr&&!b.fly){let x=b.x,y=b.y,vx=(dr.s[0]-dr.c[0])*.11,vy=(dr.s[1]-dr.c[1])*.11;const s=Math.hypot(vx,vy),k=Math.min(1,15/s);vx*=k;vy*=k;g.fillStyle='#e03131';for(let i=0;i<26;i++){vy+=.34;x+=vx;y+=vy;if(i%2)g.fillRect(x-1.5,y-1.5,3,3)}}
g.font='24px serif';g.textAlign='center';g.fillText('🏀',b.x,b.y+8);
g.fillStyle='#0007';g.fillRect(8,8,180,34);txt(g,'Baskets '+sc+' · Time '+Math.ceil(left)+'s',98,31,15);if(mt)txt(g,msgT,240,150,30,'#e8590c')})}
// Catch the Star
function star(el){let s=0,left=15;const a=document.createElement('div');a.style.cssText='position:relative;height:260px;border:2px solid var(--ln);border-radius:14px;overflow:hidden';const st=document.createElement('div');st.textContent='⭐';st.style.cssText='position:absolute;font-size:40px;cursor:pointer';a.append(st);el.append(a);
function mv(){st.style.left=R(85)+'%';st.style.top=R(75)+'%'}mv();st.onclick=()=>{s++;mv()};
timer=setInterval(()=>{left--;mv();if(left<=0){clearInterval(timer);st.style.display='none';msg('Time up! Stars: '+s+' 🎉')}else msg('Stars: '+s+'  Time: '+left)},1000);msg('Tap the star fast!')}
// Visitor counter (global count via counterapi.dev; falls back to a count on this device)
(function(){const out=n=>{$('vc').textContent=Number(n).toLocaleString()};
let counted=0;try{counted=sessionStorage.getItem('kgz_counted')}catch(e){}
const mark=()=>{try{sessionStorage.setItem('kgz_counted','1')}catch(e){}};
function local(){let n=0;try{n=+localStorage.getItem('kgz_local')||0;if(!counted){n++;localStorage.setItem('kgz_local',n)}}catch(e){}mark();$('vis').firstChild.textContent='👀 Your visits on this device: ';out(n||1)}
function load(){try{const c=new Counter({workspace:'subhankarsarkar-kidsgames'});(counted?c.get('visits'):c.up('visits')).then(r=>{const n=r&&(r.value??r.count??(r.data&&(r.data.up_count??r.data.count)));if(n==null)throw 0;out(n);mark()}).catch(local)}catch(e){local()}}
const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/counterapi@2.1.2/dist/counter.browser.min.js';sc.onload=load;sc.onerror=local;document.head.append(sc)})();
