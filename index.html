</style></head><body>

function chess(el){msg('Tap a piece, then tap a square. Rules are for you to follow!');const back='rnbqkbnr',w='RNBQKBNR',U={r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',p:'♟',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔',P:'♙'};

el.innerHTML='<style>#sb{position:relative;width:min(100%,480px);margin:8px auto;outline:2px solid var(--ln)}#sg{display:grid;grid-template-columns:repeat(10,1fr)}.sc{aspect-ratio:1;font-size:9px;color:#888;padding:2px;box-sizing:border-box;text-align:left}#ss{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#dice{width:76px;height:76px;margin:8px auto;background:#fff;border-radius:14px;box-shadow:0 3px 8px #0006;display:grid;grid-template-columns:repeat(3,1fr);padding:8px;box-sizing:border-box}</style><div id="sb"><div id="sg">'+cells+'</div><svg id="ss" viewBox="0 0 100 100">'+s+'<g id="tg"></g></svg></div><div id="dice"></div>';
const show=v=>{const f=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]][v];$('dice').innerHTML=Array.from({length:9},(_,i)=>'<b style="width:13px;height:13px;border-radius:50%;margin:auto;background:'+(f.includes(i)?'#222':'transparent')+'"></b>').join('')};

// Tic-Tac-Toe

// Hill Car Race (keyboard: → go, ← reverse/brake, ↑ turbo, ↓ handbrake)
function race(el){clearInterval(timer);
const cars=[['🚗 Red Racer','#e63946',.16,6.5,.5],['🚙 Jungle Jeep','#2a9d8f',.13,5.5,.85],['🏎️ Speedster','#f4a300',.22,8.5,.25]];

const K={l:0,r:0,u:0,d:0},M={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',ArrowDown:'d',s:'d'},FIN=6000,kk=e=>M[e.key.length==1?e.key.toLowerCase():e.key],alive=()=>$('cv')&&$('play').style.display!='none';

const G=[['💦 Water Gun','#2f9bff',140,13,'water',10,46,10],['🎯 Dart Gun','#e63946',380,20,'dart',15,60,6],['🫧 Bubble Cannon','#9b5de5',750,9,'bubble',10,40,16],['🎉 Confetti Blaster','#f4a300',900,11,'conf',10,44,13]];

G.forEach((q,i)=>{btn(el,q[0],()=>go(i)).style.background=q[1]});
function go(i0){clearInterval(timer);
el.innerHTML='<canvas id="cv" width="600" height="360" style="width:100%;max-width:600px;border-radius:14px;border:2px solid var(--ln);touch-action:none;cursor:crosshair"></canvas><div id="pad"></div><p style="font-size:14px">Aim with the mouse or finger and click/tap to shoot (hold to keep firing). Keyboard: ← → aim · Space fire · 1-4 change gun</p>';
const cv=$('cv'),g=cv.getContext('2d'),gx=300,gy=345,BC=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c','#f72585'],alive=()=>$('cv')&&$('play').style.display!='none';

const kd=e=>{if(!alive()){cleanup();return}const k=e.key;if(k=='ArrowLeft'||k=='a')K.l=1;else if(k=='ArrowRight'||k=='d')K.r=1;else if(k==' ')K.f=1;else if(/^[1-4]$/.test(k))sel=+k-1;else return;e.preventDefault()},ku=e=>{const k=e.key;if(k=='ArrowLeft'||k=='a')K.l=0;if(k=='ArrowRight'||k=='d')K.r=0;if(k==' ')K.f=0};

G.forEach((q,i)=>{const b=btn($('pad'),(i+1)+' '+q[0].split(' ')[0],()=>sel=i);b.style.background=q[1]});

function shoot(){const q=G[sel],now=Date.now();if(now-last<q[2])return;last=now;if(!st){st=1;t0=now}shots++;sfx(q[4]=='dart'?700:400);
(q[4]=='conf'?[-.3,-.15,0,.15,.3]:[0]).forEach(o=>{const a=ang+o;U.push({x:gx+Math.sin(a)*q[6],y:gy-Math.cos(a)*q[6],vx:Math.sin(a)*q[3],vy:-Math.cos(a)*q[3],t:q[4],hit:[],c:BC[Math.floor(Math.random()*7)]})})}

function draw(left){const q=G[sel],gr=g.createLinearGradient(0,0,0,360);gr.addColorStop(0,'#a5d8ff');gr.addColorStop(1,'#f1faff');g.fillStyle=gr;g.fillRect(0,0,600,360);g.textAlign='center';g.font='44px serif';for(let i=0;i<3;i++)g.fillText('☁️',((i*260-f*.3)%800+800)%800-100,60+i*40);
B.forEach(b=>{g.strokeStyle='#fff9';g.lineWidth=1;g.beginPath();g.moveTo(b.x,b.y+b.r);g.quadraticCurveTo(b.x+Math.sin(f*.1+b.ph)*6,b.y+b.r+14,b.x,b.y+b.r+28);g.stroke();g.fillStyle=b.c;g.beginPath();g.ellipse(b.x,b.y,b.r*.85,b.r,0,0,7);g.fill();g.fillStyle='#fff6';g.beginPath();g.ellipse(b.x-b.r*.3,b.y-b.r*.35,b.r*.2,b.r*.3,.5,0,7);g.fill();if(b.gold){g.font='16px serif';g.fillStyle='#fff';g.fillText('★',b.x,b.y+5)}});

if(!done){g.strokeStyle='#d00';g.lineWidth=2;g.beginPath();g.arc(ax,ay,10,0,7);g.moveTo(ax-15,ay);g.lineTo(ax+15,ay);g.moveTo(ax,ay-15);g.lineTo(ax,ay+15);g.stroke()}
g.fillStyle='#0008';g.fillRect(8,8,200,70);g.fillStyle='#fff';g.font='bold 16px sans-serif';g.textAlign='left';g.fillText('Score '+sc,16,28);g.fillText('Time '+Math.ceil(left)+' s',16,48);g.fillText(q[0],16,68);
if(!st){g.textAlign='center';g.font='bold 22px sans-serif';g.fillStyle='#000b';g.fillText('Click or press Space to start shooting!',300,150)}
if(done){g.fillStyle='#000a';g.fillRect(0,0,600,360);g.textAlign='center';g.fillStyle='#fff';g.font='bold 40px sans-serif';g.fillText('Time up!',300,160);g.font='bold 26px sans-serif';g.fillText('Score '+sc+' · '+pops+' balloons',300,205)}}
function loop(){if(!alive()){cleanup();return}f++;
if(K.l)ang=Math.max(-1.45,ang-.05);if(K.r)ang=Math.min(1.45,ang+.05);if(!done&&(firing||K.f))shoot();
const es=st?(Date.now()-t0)/1000:0,left=Math.max(0,45-es);
if(!done&&Math.random()<.045+es/1500){const gold=Math.random()<.08,r=gold?16:18+Math.random()*12;B.push({x:30+Math.random()*540,y:400,r,vy:-((gold?2.6:1+Math.random()*1.3)*(1+es/90)),c:gold?'#ffd700':BC[Math.floor(Math.random()*7)],gold,ph:Math.random()*6})}
B.forEach(b=>{b.y+=b.vy;b.x+=Math.sin(f*.05+b.ph)*.6});
U.forEach(u=>{u.x+=u.vx;u.y+=u.vy;B.forEach(b=>{if(!u.dead&&!b.dead&&!u.hit.includes(b)&&Math.hypot(b.x-u.x,b.y-u.y)<b.r+5){if(u.t=='bubble'){P.push({x:u.x,y:u.y,r:10,ring:1,l:12});B.forEach(o=>{if(!o.dead&&Math.hypot(o.x-u.x,o.y-u.y)<70)pop(o)});u.dead=1}else{pop(b);if(u.t=='dart')u.hit.push(b);else u.dead=1}}})});
B=B.filter(b=>!b.dead&&b.y>-60);U=U.filter(u=>!u.dead&&u.x>-20&&u.x<620&&u.y>-20);
P.forEach(p=>{if(p.ring)p.r+=5;else{p.x+=p.vx;p.y+=p.vy;p.vy+=.15}p.l--});P=P.filter(p=>p.l>0);X.forEach(t=>{t.y-=1;t.l--});X=X.filter(t=>t.l>0);
if(st&&left<=0&&!done){done=1;draw(0);cleanup();const s=sc>=450?3:sc>=250?2:1;msg('⏰ Time up! Score '+sc+' · '+pops+' balloons popped '+'⭐'.repeat(s)+' 🎉');btn(el,'Play again',()=>go(sel));btn(el,'Change gun',()=>balloon(el));return}
draw(left)}
draw(45);msg('Aim and click (or press Space) to start! Golden balloons ★ give 50 points.');timer=setInterval(loop,25)}}
// Target Shooting (mouse/touch aim + click, hold Space to steady; arrows + Enter also work)
function target(el){clearInterval(timer);
const G=[['🔫 Toy Pistol','#e63946',24,400,10],['🎯 Air Rifle','#2f9bff',11,1200,6],['⚡ Rapid Blaster','#f4a300',34,150,15]];
el.innerHTML='<p>Choose your gun:<br>🔫 Toy Pistol – 10 shots, normal wobble · 🎯 Air Rifle – only 6 shots, but very steady · ⚡ Rapid Blaster – 15 fast shots, big wobble</p>';msg('Pick a gun, then hit the centre of the board!');
G.forEach((q,i)=>btn(el,q[0],()=>go(i)).style.background=q[1]);
function go(sel){clearInterval(timer);const q=G[sel];
el.innerHTML='<canvas id="cv" width="600" height="400" style="width:100%;max-width:600px;border-radius:14px;border:2px solid var(--ln);touch-action:none;cursor:none"></canvas><div id="pad"></div><p style="font-size:14px">Move the mouse (or touch) to aim, click/tap to shoot. The crosshair wobbles – hold Space (or 💨) to steady it. Keyboard: arrows aim · Enter fire · Space hold breath</p>';
const cv=$('cv'),g=cv.getContext('2d'),TX=300,TY=165,R=140,alive=()=>$('cv')&&$('play').style.display!='none';
let ax=300,ay=165,ox=0,oy=0,K={l:0,r:0,u:0,d:0,b:0},bh=0,hd=0,breath=100,last=0,left=q[4],sc=0,H=[],X=[],f=0,rec=0,fl=0,done=0,dt=0,ended=0,ac=null;
function bang(){try{ac=ac||new AudioContext();const o=ac.createOscillator(),gn=ac.createGain(),t=ac.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);gn.gain.setValueAtTime(.15,t);gn.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(gn);gn.connect(ac.destination);o.start();o.stop(t+.2)}catch(e){}}
function fire(){const now=Date.now();if(done||now-last<q[3])return;last=now;left--;const hx=ax+ox,hy=ay+oy,d=Math.hypot(hx-TX,hy-TY),s=d>=R?0:10-Math.floor(d/14);sc+=s;H.push({x:hx,y:hy});X.push({x:hx,y:hy-14,t:s?'+'+s:'Miss',l:35});rec=12;fl=4;bang();msg(s==10?'🎯 BULLSEYE! +10':s>=8?'Great shot! +'+s:s>0?'Hit! +'+s:'Missed the board 😮');if(left<=0){done=1;dt=now}}
const kd=e=>{if(!alive()){cleanup();return}const k=e.key;if(k=='ArrowLeft'||k=='a')K.l=1;else if(k=='ArrowRight'||k=='d')K.r=1;else if(k=='ArrowUp'||k=='w')K.u=1;else if(k=='ArrowDown'||k=='s')K.d=1;else if(k==' '||k=='Shift')K.b=1;else if(k=='Enter'||k=='f'){if(!e.repeat)fire()}else return;e.preventDefault()},ku=e=>{const k=e.key;if(k=='ArrowLeft'||k=='a')K.l=0;if(k=='ArrowRight'||k=='d')K.r=0;if(k=='ArrowUp'||k=='w')K.u=0;if(k=='ArrowDown'||k=='s')K.d=0;if(k==' '||k=='Shift')K.b=0};
function cleanup(){clearInterval(timer);removeEventListener('keydown',kd);removeEventListener('keyup',ku)}
addEventListener('keydown',kd);addEventListener('keyup',ku);
const bf=btn($('pad'),'🔥 Fire',()=>{});bf.style.touchAction='none';bf.onpointerdown=fire;const bb=btn($('pad'),'💨 Hold breath',()=>{});bb.style.touchAction='none';bb.onpointerdown=()=>bh=1;bb.onpointerup=bb.onpointerleave=()=>bh=0;
const setA=e=>{const r=cv.getBoundingClientRect();ax=(e.clientX-r.left)*600/r.width;ay=(e.clientY-r.top)*400/r.height};cv.onpointermove=setA;cv.onpointerdown=e=>{setA(e);fire()};
function draw(){const now=Date.now(),gr=g.createLinearGradient(0,0,0,330);gr.addColorStop(0,'#cfd8e3');gr.addColorStop(1,'#eef2f7');g.fillStyle=gr;g.fillRect(0,0,600,330);g.fillStyle='#8d99a6';g.fillRect(0,330,600,70);g.fillStyle='#7a8794';g.fillRect(0,330,600,4);
g.fillStyle='#6d4c41';g.fillRect(TX-6,TY+R,12,170-0);g.fillStyle='#8d6e63';g.fillRect(TX-R-12,TY-R-12,2*R+24,2*R+24);
['#f1f3f5','#212529','#339af0','#fa5252','#ffd43b'].forEach((c,i)=>{for(let k=i*2;k<i*2+2;k++){g.fillStyle=c;g.beginPath();g.arc(TX,TY,(10-k)*14,0,7);g.fill();g.strokeStyle='#0003';g.lineWidth=1;g.stroke()}});
H.forEach(h=>{g.fillStyle='#111';g.beginPath();g.arc(h.x,h.y,4,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=1;g.stroke()});
g.textAlign='center';g.font='bold 20px sans-serif';g.lineWidth=4;X.forEach(t=>{g.strokeStyle='#fff';g.strokeText(t.t,t.x,t.y);g.fillStyle='#d6336c';g.fillText(t.t,t.x,t.y)});
const ga=Math.max(-.7,Math.min(.7,Math.atan2(ax+ox-300,395-(ay+oy))));g.save();g.translate(300,400+rec*.8);g.rotate(ga);g.fillStyle=q[1];g.fillRect(-8,-70,16,66);g.fillStyle='#333';g.fillRect(-10,-76,20,8);g.fillStyle='#555';g.beginPath();g.arc(0,0,28,0,7);g.fill();g.fillStyle=q[1];g.fillRect(-14,-10,28,40);if(fl>0){g.fillStyle='#ffd43b';g.beginPath();g.arc(0,-84,10,0,7);g.fill()}g.restore();
if(!done){const cx=ax+ox,cy=ay+oy;g.strokeStyle=hd?'#12b886':'#e03131';g.lineWidth=2;g.beginPath();g.arc(cx,cy,12,0,7);g.moveTo(cx-20,cy);g.lineTo(cx+20,cy);g.moveTo(cx,cy-20);g.lineTo(cx,cy+20);g.stroke()}
g.fillStyle='#0008';g.fillRect(8,8,170,66);g.fillRect(420,8,172,50);g.fillStyle='#fff';g.font='bold 16px sans-serif';g.textAlign='left';g.fillText('Score '+sc,16,28);g.fillText('Shots left '+left,16,48);g.fillText(q[0],16,68);
g.font='12px sans-serif';g.fillText('Steady breath',428,24);g.fillText('Reload',428,46);g.fillStyle='#4dabf7';g.fillRect(510,15,76*breath/100,8);g.fillStyle='#ffa94d';g.fillRect(510,37,76*Math.min(1,(now-last)/q[3]),8);
if(ended){g.fillStyle='#000a';g.fillRect(0,0,600,400);g.textAlign='center';g.fillStyle='#fff';g.font='bold 40px sans-serif';g.fillText('Round over!',300,160);g.font='bold 28px sans-serif';g.fillText('Score '+sc+' / '+q[4]*10,300,210)}}
function loop(){if(!alive()){cleanup();return}f++;ax=Math.max(0,Math.min(600,ax+(K.r-K.l)*4));ay=Math.max(0,Math.min(400,ay+(K.d-K.u)*4));
const want=K.b||bh;hd=want&&breath>0;if(hd)breath=Math.max(0,breath-1.2);else if(!want)breath=Math.min(100,breath+.5);
const A=q[2]*(hd?.22:1);ox=Math.sin(f*.071)*A+Math.sin(f*.13)*A*.4;oy=Math.cos(f*.057)*A+Math.cos(f*.11)*A*.4;
if(rec>0)rec--;if(fl>0)fl--;X.forEach(t=>{t.y-=.7;t.l--});X=X.filter(t=>t.l>0);
if(done&&!ended&&Date.now()-dt>700){ended=1;draw();cleanup();const p=sc/(q[4]*10),s=p>=.8?3:p>=.55?2:1;msg('Final score '+sc+' / '+q[4]*10+' '+'⭐'.repeat(s)+' 🎉');btn(el,'Play again',()=>go(sel));btn(el,'Change gun',()=>target(el));return}
draw()}
draw();msg('Aim at the centre and shoot! Hold Space to steady the crosshair.');timer=setInterval(loop,25)}}
// Catch the Star
function star(el){let s=0,left=15;const a=document.createElement('div');a.style.cssText='position:relative;height:260px;border:2px solid var(--ln);border-radius:14px;overflow:hidden';const st=document.createElement('div');st.textContent='⭐';st.style.cssText='position:absolute;font-size:40px;cursor:pointer';a.append(st);el.append(a);
function mv(){st.style.left=R(85)+'%';st.style.top=R(75)+'%'}mv();st.onclick=()=>{s++;mv()};
timer=setInterval(()=>{left--;mv();if(left<=0){clearInterval(timer);st.style.display='none';msg('Time up! Stars: '+s+' 🎉')}else msg('Stars: '+s+'  Time: '+left)},1000);msg('Tap the star fast!')}
</script></body></html>
